name: Mot du jour — Instagram & TikTok

on:
  schedule:
    # 06:05 UTC = 08:05 à Zurich en été, 07:05 en hiver.
    - cron: "5 6 * * *"
    # Rattrapage : si le run du matin a échoué ou n'est jamais parti, celui-ci
    # publie ; si le mot est déjà passé, il ne fait rien.
    - cron: "35 9 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Date à publier (AAAA-MM-JJ). Vide = aujourd'hui."
        required: false
      blanc:
        description: "Fabriquer les visuels sans publier"
        type: boolean
        default: false
      sans_instagram:
        description: "Ne pas publier sur Instagram (utile pour tester TikTok seul)"
        type: boolean
        default: false
      sans_tiktok:
        description: "Ne pas publier sur TikTok"
        type: boolean
        default: false
      sans_threads:
        description: "Ne pas publier sur Threads"
        type: boolean
        default: false
      sans_facebook:
        description: "Ne pas publier sur la Page Facebook"
        type: boolean
        default: false
      rattrapage:
        description: "Ne publier que si le mot du jour n'est pas déjà passé"
        type: boolean
        default: false

concurrency:
  group: mot-du-jour
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publier:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Cache de la voix
        uses: actions/cache@v4
        with:
          path: ~/.cache/piper
          key: piper-fr_FR-siwis-medium-v1

      - name: Dépendances
        timeout-minutes: 12
        run: |
          # Le 2026-08-19, apt s'est figé sans une ligne de sortie et a mangé les
          # 40 minutes du job. D'où : ffmpeg est déjà là la plupart du temps, on ne
          # l'installe que s'il manque, chaque commande est bornée, et on réessaie.
          if ! command -v ffmpeg >/dev/null 2>&1; then
            for essai in 1 2; do
              if sudo timeout 120 apt-get update -qq && sudo timeout 240 apt-get install -y -qq ffmpeg; then
                break
              fi
              echo "apt a échoué ou traîné (essai $essai) — on relâche les verrous et on réessaie"
              sudo rm -f /var/lib/apt/lists/lock /var/cache/apt/archives/lock /var/lib/dpkg/lock*
              sleep 20
            done
          fi
          if ! command -v ffmpeg >/dev/null 2>&1; then
            # Dernier recours, sans apt du tout : imageio-ffmpeg embarque un binaire
            # statique, installé depuis PyPI. Le miroir Ubuntu peut mourir, pas la chaîne.
            echo "apt indisponible — on prend le ffmpeg embarqué dans imageio-ffmpeg"
            timeout 300 pip install imageio-ffmpeg
            BIN=$(python3 -c "import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())")
            sudo ln -sf "$BIN" /usr/local/bin/ffmpeg
          fi
          command -v ffmpeg >/dev/null 2>&1 || { echo "ffmpeg introuvable, même en dernier recours"; exit 1; }
          ffmpeg -version | head -1
          for essai in 1 2 3; do
            if timeout 420 pip install -r social/requirements.txt; then break; fi
            echo "pip a échoué (essai $essai)"
            sleep 20
          done
          python3 -c "import PIL, requests, nacl, numpy; print('dépendances en place')"

      - name: Publier
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_LOGIN_MODE: ${{ vars.IG_LOGIN_MODE || 'instagram' }}
          FB_APP_ID: ${{ secrets.FB_APP_ID }}
          FB_APP_SECRET: ${{ secrets.FB_APP_SECRET }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          TIKTOK_MODE: ${{ vars.TIKTOK_MODE || 'direct' }}
          TIKTOK_VISIBILITE: ${{ vars.TIKTOK_VISIBILITE || 'PUBLIC_TO_EVERYONE' }}
          THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python3 social/publier.py \
            ${{ github.event.inputs.date && format('--date {0}', github.event.inputs.date) || '' }} \
            ${{ github.event.inputs.blanc == 'true' && '--blanc' || '' }} \
            ${{ github.event.inputs.sans_instagram == 'true' && '--sans-instagram' || '' }} \
            ${{ github.event.inputs.sans_tiktok == 'true' && '--sans-tiktok' || '' }} \
            ${{ github.event.inputs.sans_threads == 'true' && '--sans-threads' || '' }} \
            ${{ github.event.inputs.sans_facebook == 'true' && '--sans-facebook' || '' }} \
            ${{ (github.event.inputs.rattrapage == 'true' || github.event.schedule == '35 9 * * *') && '--rattrapage' || '' }}

      - name: Garder une trace en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mot-du-jour-${{ github.run_id }}
          path: social/out/
          retention-days: 14
